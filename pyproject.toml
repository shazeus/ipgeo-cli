[build-system]
requires = ["setuptools>=68,<75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipgeo-cli"
version = "0.1.2"
description = "IP geolocation and intelligence tool — geolocate IPs, bulk lookup, reverse DNS, CIDR calc, VPN detection."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "shazeus", email = "efeborazan07@gmail.com" }]
keywords = ["ip", "geolocation", "networking", "cli", "geoip", "reverse-dns", "cidr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/shazeus/ipgeo-cli"
Repository = "https://github.com/shazeus/ipgeo-cli"
"Bug Tracker" = "https://github.com/shazeus/ipgeo-cli/issues"

[project.scripts]
ipgeo = "ipgeo.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ipgeo*"]
